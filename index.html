<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>BusBooking</title>
  </head>

  <body>
    <script>
      const hasToken =
        localStorage.getItem("transport_access_token") ||
        sessionStorage.getItem("transport_access_token");

      if (hasToken) {
        window.location.replace("./pages/trips.html");
      } else {
        window.location.replace("./pages/login.html");
      }
    </script>
  </body>
</html>
