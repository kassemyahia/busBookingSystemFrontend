<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>BusBooking</title>
  </head>

  <body>
    <script>
      const hasToken =
        localStorage.getItem("transport_access_token") ||
        sessionStorage.getItem("transport_access_token");

      const storage = localStorage.getItem("transport_access_token")
        ? localStorage
        : sessionStorage;
      const accountType = storage.getItem("transport_account_type");
      const role = storage.getItem("transport_role");

      if (hasToken && accountType === "Driver") {
        window.location.replace("./pages/driver/driver-dashboard.html");
      } else if (
        hasToken &&
        accountType === "Employee" &&
        (role === "Manager" || role === "OfficeEmployee")
      ) {
        window.location.replace("./pages/admin/admin-dashboard.html");
      } else if (hasToken) {
        window.location.replace("./pages/user/trips.html");
      } else {
        window.location.replace("./pages/auth/login.html");
      }
    </script>
  </body>
</html>
