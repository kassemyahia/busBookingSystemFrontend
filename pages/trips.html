<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>BusBooking | Trips</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="../css/styles.css" />
  </head>

  <body class="bg-slate-50 text-slate-900">
    <div id="appHeader"></div>

    <main
      class="mx-auto min-h-[calc(100vh-8rem)] max-w-7xl px-5 py-10 sm:px-6 lg:px-8"
    >
      <div class="mb-8">
        <p class="mb-2 text-sm font-semibold text-cyan-700">
          Find your journey
        </p>

        <h1 class="text-3xl font-bold tracking-tight sm:text-4xl">
          Available trips
        </h1>

        <p class="mt-3 text-slate-500">
          Search routes, compare buses, and choose the trip that works for you.
        </p>
      </div>

      <section
        class="mb-8 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-6"
      >
        <form
          id="tripSearchForm"
          class="grid gap-4 md:grid-cols-2 lg:grid-cols-6"
        >
          <div>
            <label
              class="mb-2 block text-xs font-semibold uppercase tracking-wide text-slate-500"
            >
              From
            </label>

            <select
              id="startCity"
              disabled
              class="w-full rounded-xl border border-slate-200 bg-white px-3 py-3 text-sm outline-none focus:border-slate-950 disabled:cursor-wait disabled:bg-slate-50 disabled:text-slate-400"
            >
              <option value="">Loading cities...</option>
            </select>
          </div>

          <div>
            <label
              class="mb-2 block text-xs font-semibold uppercase tracking-wide text-slate-500"
            >
              To
            </label>

            <select
              id="endCity"
              disabled
              class="w-full rounded-xl border border-slate-200 bg-white px-3 py-3 text-sm outline-none focus:border-slate-950 disabled:cursor-wait disabled:bg-slate-50 disabled:text-slate-400"
            >
              <option value="">Loading cities...</option>
            </select>
          </div>

          <div>
            <label
              class="mb-2 block text-xs font-semibold uppercase tracking-wide text-slate-500"
            >
              Date
            </label>

            <input
              id="tripDate"
              type="date"
              class="w-full rounded-xl border border-slate-200 px-3 py-3 text-sm outline-none focus:border-slate-950"
            />
          </div>

          <div>
            <label
              class="mb-2 block text-xs font-semibold uppercase tracking-wide text-slate-500"
            >
              Bus type
            </label>

            <input
              id="busType"
              type="text"
              placeholder="Optional"
              class="w-full rounded-xl border border-slate-200 px-3 py-3 text-sm outline-none focus:border-slate-950"
            />
          </div>

          <div>
            <label
              class="mb-2 block text-xs font-semibold uppercase tracking-wide text-slate-500"
            >
              Sort
            </label>

            <select
              id="sortBy"
              class="w-full rounded-xl border border-slate-200 px-3 py-3 text-sm outline-none focus:border-slate-950"
            >
              <option value="">Default</option>

              <option value="time">Time</option>

              <option value="startcity">Start city</option>

              <option value="endcity">End city</option>

              <option value="bustype">Bus type</option>
            </select>
          </div>

          <div>
            <label
              class="mb-2 block text-xs font-semibold uppercase tracking-wide text-slate-500"
            >
              Order
            </label>

            <select
              id="sortOrder"
              class="w-full rounded-xl border border-slate-200 px-3 py-3 text-sm outline-none focus:border-slate-950"
            >
              <option value="asc">Ascending</option>

              <option value="desc">Descending</option>
            </select>
          </div>

          <div class="flex gap-3 md:col-span-2 lg:col-span-6">
            <button
              type="submit"
              class="rounded-xl bg-slate-950 px-6 py-3 text-sm font-semibold text-white hover:bg-slate-800"
            >
              Search trips
            </button>

            <button
              id="resetSearch"
              type="button"
              class="rounded-xl border border-slate-200 bg-white px-6 py-3 text-sm font-semibold text-slate-600 hover:bg-slate-50"
            >
              Reset
            </button>
          </div>
        </form>
      </section>

      <div id="tripsAlert" class="mb-6 hidden"></div>

      <div id="tripsLoading" class="py-20 text-center text-slate-400">
        Loading trips...
      </div>

      <div
        id="tripsGrid"
        class="grid gap-5 md:grid-cols-2 xl:grid-cols-3"
      ></div>
    </main>

    <div id="appFooter"></div>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/trips.js"></script>
  </body>
</html>
