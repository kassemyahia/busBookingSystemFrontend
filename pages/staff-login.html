<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BusBooking | Staff Login</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="../css/styles.css"></head><body class="min-h-screen bg-slate-950 text-slate-900"><main class="grid min-h-screen place-items-center p-5"><section class="w-full max-w-md rounded-2xl bg-white p-8 shadow-2xl"><a href="../index.html" class="mb-8 block text-xl font-bold">BusBooking <span class="text-cyan-700">Staff</span></a><h1 class="text-3xl font-bold">Staff sign in</h1><p class="mt-2 text-sm text-slate-500">For managers and office employees.</p><div id="alert" class="mt-5 hidden rounded-xl border border-red-200 bg-red-50 p-3 text-sm text-red-700"></div><form id="loginForm" class="mt-6 space-y-4"><label class="block text-sm font-semibold">Phone<input name="phone" inputmode="numeric" maxlength="10" required placeholder="09XXXXXXXX" class="mt-2 w-full rounded-xl border px-4 py-3"></label><label class="block text-sm font-semibold">Password<input name="password" type="password" required class="mt-2 w-full rounded-xl border px-4 py-3"></label><label class="flex gap-2 text-sm"><input name="remember" type="checkbox"> Keep me signed in</label><button id="loginButton" class="w-full rounded-xl bg-cyan-500 px-4 py-3 font-semibold">Sign in</button></form><p class="mt-6 text-center text-sm"><a class="text-cyan-700" href="./driver-login.html">Driver login</a> · <a href="./login.html">Passenger login</a></p></section></main><script src="../js/config.js"></script><script src="../js/api.js"></script><script src="../js/auth.js"></script><script src="../js/staff-login.js"></script></body></html>
