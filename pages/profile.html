<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>BusBooking | Profile</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="../css/styles.css" />
  </head>

  <body class="bg-slate-50 text-slate-900">
    <div id="appHeader"></div>

    <main
      class="mx-auto min-h-[calc(100vh-8rem)] max-w-5xl px-5 py-10 sm:px-6 lg:px-8"
    >
      <div class="mb-8">
        <p class="text-sm font-semibold text-cyan-700">Account</p>

        <h1 class="mt-2 text-3xl font-bold">Profile settings</h1>

        <p class="mt-3 text-slate-500">
          Update your personal details and password.
        </p>
      </div>

      <div class="grid gap-6 lg:grid-cols-2">
        <section
          class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm"
        >
          <div class="mb-6">
            <h2 class="text-xl font-bold">Personal information</h2>

            <p class="mt-1 text-sm text-slate-500">
              Update your name or phone number.
            </p>
          </div>

          <div id="profileAlert" class="mb-5 hidden"></div>

          <form id="profileForm" class="space-y-5">
            <div>
              <label class="mb-2 block text-sm font-semibold">
                First name
              </label>

              <input
                id="profileFirstName"
                type="text"
                class="w-full rounded-xl border border-slate-200 px-4 py-3 outline-none focus:border-slate-950"
              />
            </div>

            <div>
              <label class="mb-2 block text-sm font-semibold">
                Last name
              </label>

              <input
                id="profileLastName"
                type="text"
                class="w-full rounded-xl border border-slate-200 px-4 py-3 outline-none focus:border-slate-950"
              />
            </div>

            <div>
              <label class="mb-2 block text-sm font-semibold"> Phone </label>

              <input
                id="profilePhone"
                type="tel"
                maxlength="10"
                inputmode="numeric"
                class="w-full rounded-xl border border-slate-200 px-4 py-3 outline-none focus:border-slate-950"
              />
            </div>

            <button
              id="saveProfileButton"
              type="submit"
              class="w-full rounded-xl bg-slate-950 px-5 py-3 text-sm font-semibold text-white hover:bg-slate-800 disabled:opacity-50"
            >
              Save changes
            </button>
          </form>
        </section>

        <section
          class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm"
        >
          <div class="mb-6">
            <h2 class="text-xl font-bold">Change password</h2>

            <p class="mt-1 text-sm text-slate-500">
              Use at least 8 characters.
            </p>
          </div>

          <div id="passwordAlert" class="mb-5 hidden"></div>

          <form id="passwordForm" class="space-y-5">
            <div>
              <label class="mb-2 block text-sm font-semibold">
                Current password
              </label>

              <input
                id="oldPassword"
                type="password"
                autocomplete="current-password"
                class="w-full rounded-xl border border-slate-200 px-4 py-3 outline-none focus:border-slate-950"
              />
            </div>

            <div>
              <label class="mb-2 block text-sm font-semibold">
                New password
              </label>

              <input
                id="newPassword"
                type="password"
                autocomplete="new-password"
                class="w-full rounded-xl border border-slate-200 px-4 py-3 outline-none focus:border-slate-950"
              />
            </div>

            <div>
              <label class="mb-2 block text-sm font-semibold">
                Confirm new password
              </label>

              <input
                id="confirmNewPassword"
                type="password"
                autocomplete="new-password"
                class="w-full rounded-xl border border-slate-200 px-4 py-3 outline-none focus:border-slate-950"
              />
            </div>

            <button
              id="changePasswordButton"
              type="submit"
              class="w-full rounded-xl border border-slate-950 bg-white px-5 py-3 text-sm font-semibold text-slate-950 hover:bg-slate-50 disabled:opacity-50"
            >
              Change password
            </button>
          </form>
        </section>
      </div>
    </main>

    <div id="appFooter"></div>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/profile.js"></script>
  </body>
</html>
