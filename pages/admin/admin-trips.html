<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Trip Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../../assets/css/styles.css" />
  </head>
  <body class="bg-slate-50">
    <div id="staffShell"></div>
    <main class="p-5 lg:ml-64 lg:p-8">
      <div id="pageAlert" class="hidden"></div>
      <div class="mb-6 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 class="text-3xl font-bold">Trips</h1>
          <p class="text-slate-500">Schedule, search and inspect trips.</p>
        </div>
        <button
          id="addButton"
          class="rounded-xl bg-teal-600 px-4 py-3 font-semibold"
        >
          Create trip
        </button>
      </div>
      <form
        id="filters"
        class="mb-5 grid gap-3 rounded-2xl border bg-white p-4 sm:grid-cols-3 lg:grid-cols-6"
      ></form>
      <div id="loadingState">Loading…</div>
      <div id="tableRoot"></div>
      <div id="detailsRoot" class="mt-6"></div>
    </main>
    <div id="modalRoot"></div>
    <script src="../../assets/js/core/config.js"></script>
    <script src="../../assets/js/core/api.js"></script>
    <script src="../../assets/js/core/auth.js"></script>
    <script src="../../assets/js/admin/admin-common.js"></script>
    <script src="../../assets/js/layouts/staff-layout.js"></script>
    <script src="../../assets/js/admin/admin-trips.js"></script>
  </body>
</html>
