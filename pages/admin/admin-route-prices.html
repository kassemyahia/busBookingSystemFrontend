<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Route Prices</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../../assets/css/styles.css" />
  </head>
  <body class="bg-slate-50">
    <div id="staffShell"></div>
    <main class="p-5 lg:ml-64 lg:p-8">
      <div id="pageAlert" class="hidden"></div>
      <div class="mb-6 flex justify-between">
        <h1 class="text-3xl font-bold">Route Prices</h1>
        <button
          id="addButton"
          class="rounded-xl bg-teal-600 px-4 py-3 font-semibold"
        >
          Add route
        </button>
      </div>
      <div id="loadingState">Loading…</div>
      <h2 class="mb-3 text-xl font-bold">Active routes</h2>
      <div id="tableRoot"></div>
      <h2 class="mb-3 mt-8 text-xl font-bold">Deleted routes</h2>
      <div id="deletedRoot"></div>
      <div id="statsRoot" class="mt-8"></div>
    </main>
    <div id="modalRoot"></div>
    <script src="../../assets/js/core/config.js"></script>
    <script src="../../assets/js/core/api.js"></script>
    <script src="../../assets/js/core/auth.js"></script>
    <script src="../../assets/js/admin/admin-common.js"></script>
    <script src="../../assets/js/layouts/staff-layout.js"></script>
    <script src="../../assets/js/admin/admin-route-prices.js"></script>
  </body>
</html>
