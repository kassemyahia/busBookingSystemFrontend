<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>BusBooking | Booking</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="../../assets/css/styles.css" />
  </head>

  <body class="bg-slate-50 text-slate-900">
    <div id="appHeader"></div>

    <main
      class="mx-auto min-h-[calc(100vh-8rem)] max-w-4xl px-5 py-10 sm:px-6 lg:px-8"
    >
      <div class="mb-8">
        <p class="text-sm font-semibold text-teal-700">Step 2 of 3</p>

        <h1 class="mt-2 text-3xl font-bold">Review your booking</h1>

        <p class="mt-3 text-slate-500">
          Confirm the selected seat before starting the payment process.
        </p>
      </div>

      <div id="bookingAlert" class="mb-6 hidden"></div>

      <section
        id="bookingSummary"
        class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm"
      >
        <div class="py-12 text-center text-slate-400">Loading booking...</div>
      </section>

      <section class="mt-6 rounded-2xl border border-amber-200 bg-amber-50 p-5">
        <p class="font-semibold text-amber-900">Important</p>

        <p class="mt-1 text-sm leading-6 text-amber-700">
          Your selected seat is not held yet. Confirming below creates a
          temporary reservation for two hours while you pay.
        </p>
      </section>

      <div class="mt-6 flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
        <a
          id="changeSeatLink"
          href="./trips.html"
          class="rounded-xl border border-slate-200 bg-white px-6 py-3 text-center text-sm font-semibold text-slate-600 hover:bg-slate-50"
        >
          Change seat
        </a>

        <button
          id="reserveButton"
          type="button"
          class="rounded-xl bg-teal-600 px-6 py-3 text-sm font-semibold text-white hover:bg-teal-700 disabled:opacity-50"
        >
          Reserve seat & continue
        </button>
      </div>
    </main>

    <div id="appFooter"></div>

    <script src="../../assets/js/core/config.js"></script>
    <script src="../../assets/js/core/api.js"></script>
    <script src="../../assets/js/core/auth.js"></script>
    <script src="../../assets/js/layouts/user-layout.js"></script>
    <script src="../../assets/js/user/booking.js"></script>
  </body>
</html>
