<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BusBooking | Find a trip</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body class="bg-slate-50 text-slate-900">
  <div id="appHeader"></div>
  <main>
    <section class="travel-hero min-h-[430px] px-5 pb-28 pt-16 text-white sm:px-6 lg:px-8">
      <div class="mx-auto max-w-7xl">
        <p class="text-sm font-bold uppercase tracking-[.22em] text-teal-300">Travel across Syria with confidence</p>
        <h1 class="mt-4 max-w-2xl text-4xl font-extrabold leading-tight tracking-tight sm:text-5xl lg:text-6xl">Your next journey starts here.</h1>
        <p class="mt-5 max-w-xl text-base leading-7 text-slate-300 sm:text-lg">Compare scheduled routes, choose your seat and manage your journey from one reliable place.</p>
      </div>
    </section>

    <section class="mx-auto -mt-20 max-w-7xl px-5 sm:px-6 lg:px-8">
      <form id="tripSearchForm" class="search-panel relative z-10 grid gap-4 rounded-2xl border border-slate-200 bg-white p-5 md:grid-cols-2 lg:grid-cols-12 lg:p-7">
        <label class="lg:col-span-3"><span class="mb-2 block text-xs font-bold uppercase tracking-wide text-slate-500">From</span><select id="startCity" disabled class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3.5 text-sm outline-none focus:border-teal-600 disabled:bg-slate-50"><option>Loading cities...</option></select></label>
        <button id="swapCities" type="button" aria-label="Swap departure and destination" class="hidden self-end rounded-xl border border-slate-200 bg-slate-50 py-3.5 text-teal-700 hover:bg-teal-50 lg:col-span-1 lg:block">⇄</button>
        <label class="lg:col-span-3"><span class="mb-2 block text-xs font-bold uppercase tracking-wide text-slate-500">To</span><select id="endCity" disabled class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3.5 text-sm outline-none focus:border-teal-600 disabled:bg-slate-50"><option>Loading cities...</option></select></label>
        <label class="lg:col-span-3"><span class="mb-2 block text-xs font-bold uppercase tracking-wide text-slate-500">Departure date</span><input id="tripDate" type="date" class="w-full rounded-xl border border-slate-200 px-4 py-3.5 text-sm outline-none focus:border-teal-600"></label>
        <button type="submit" class="self-end rounded-xl bg-teal-600 px-6 py-3.5 text-sm font-bold text-white shadow-sm hover:bg-teal-700 lg:col-span-2">Search trips</button>
        <div id="advancedFilters" class="hidden gap-4 border-t border-slate-100 pt-4 md:col-span-2 md:grid-cols-3 lg:col-span-12 lg:grid">
          <label><span class="mb-2 block text-xs font-bold uppercase text-slate-500">Bus type</span><input id="busType" type="text" placeholder="Any bus type" class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm"></label>
          <label><span class="mb-2 block text-xs font-bold uppercase text-slate-500">Sort by</span><select id="sortBy" class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm"><option value="">Recommended</option><option value="time">Departure time</option><option value="startcity">Origin</option><option value="endcity">Destination</option><option value="bustype">Bus type</option></select></label>
          <label><span class="mb-2 block text-xs font-bold uppercase text-slate-500">Order</span><select id="sortOrder" class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm"><option value="asc">Ascending</option><option value="desc">Descending</option></select></label>
        </div>
        <div class="flex items-center justify-between md:col-span-2 lg:col-span-12"><p class="text-xs text-slate-400">Choose any combination of filters.</p><button id="resetSearch" type="button" class="text-sm font-semibold text-teal-700 hover:text-teal-900">Reset filters</button></div>
      </form>
      <div id="popularRoutes" class="mt-5 flex min-h-9 flex-wrap items-center gap-2"></div>
    </section>

    <section class="mx-auto max-w-7xl px-5 py-14 sm:px-6 lg:px-8">
      <div class="mb-7 flex flex-wrap items-end justify-between gap-3"><div><p class="text-sm font-bold text-teal-700">Available departures</p><h2 class="mt-1 text-3xl font-bold tracking-tight">Choose your trip</h2></div><button id="mobileFilters" type="button" class="rounded-xl border bg-white px-4 py-2 text-sm font-semibold lg:hidden">Filters</button></div>
      <div id="tripsAlert" class="mb-6 hidden"></div>
      <div id="tripsLoading" class="rounded-2xl border border-dashed bg-white py-20 text-center text-slate-400">Finding available trips...</div>
      <div id="tripsGrid" class="space-y-5"></div>
    </section>
  </main>
  <div id="appFooter"></div>
  <script src="../../assets/js/core/config.js"></script><script src="../../assets/js/core/api.js"></script><script src="../../assets/js/core/auth.js"></script><script src="../../assets/js/layouts/user-layout.js"></script><script src="../../assets/js/user/trips.js"></script>
</body></html>
