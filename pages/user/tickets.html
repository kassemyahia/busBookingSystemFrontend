<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>BusBooking | My tickets</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="../../assets/css/styles.css" />
  </head>

  <body class="bg-slate-50 text-slate-900">
    <div id="appHeader"></div>

    <main
      class="mx-auto min-h-[calc(100vh-8rem)] max-w-7xl px-5 py-10 sm:px-6 lg:px-8"
    >
      <div
        class="mb-8 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between"
      >
        <div>
          <p class="text-sm font-semibold text-teal-700">Your journeys</p>

          <h1 class="mt-2 text-3xl font-bold">My tickets</h1>

          <p class="mt-3 text-slate-500">
            View pending and confirmed bookings.
          </p>
        </div>

        <a
          href="./trips.html"
          class="rounded-xl bg-teal-600 px-5 py-3 text-center text-sm font-semibold text-white hover:bg-teal-700"
        >
          Book another trip
        </a>
      </div>

      <div id="ticketsAlert" class="mb-6 hidden"></div>

      <div
        id="cancellationConfirmation"
        class="mb-6 hidden rounded-2xl border border-amber-200 bg-amber-50 p-5"
        role="alertdialog"
        aria-labelledby="cancellationConfirmationTitle"
      >
        <h2
          id="cancellationConfirmationTitle"
          class="font-bold text-amber-900"
        >
          Confirm cancellation
        </h2>

        <p
          id="cancellationConfirmationMessage"
          class="mt-2 text-sm text-amber-800"
        ></p>

        <div class="mt-4 flex flex-wrap gap-3">
          <button
            id="proceedCancellation"
            type="button"
            class="rounded-xl bg-red-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-red-700 disabled:cursor-not-allowed disabled:opacity-50"
          >
            Proceed with cancellation
          </button>

          <button
            id="keepBooking"
            type="button"
            class="rounded-xl border border-amber-300 bg-white px-5 py-2.5 text-sm font-semibold text-amber-900 hover:bg-amber-100"
          >
            Keep booking
          </button>
        </div>
      </div>

      <div
        class="mb-6 inline-flex rounded-xl border border-slate-200 bg-white p-1"
      >
        <button
          id="normalTicketsTab"
          type="button"
          class="rounded-lg bg-slate-950 px-4 py-2 text-sm font-semibold text-white"
        >
          Travel tickets
        </button>

        <button
          id="discountTicketsTab"
          type="button"
          class="rounded-lg px-4 py-2 text-sm font-semibold text-slate-500"
        >
          Discount tickets
        </button>
      </div>

      <section id="normalTicketsSection">
        <div id="ticketsLoading" class="py-20 text-center text-slate-400">
          Loading tickets...
        </div>

        <div id="ticketsGrid" class="grid gap-5 lg:grid-cols-2"></div>
      </section>

      <section id="discountTicketsSection" class="hidden">
        <div id="discountGrid" class="grid gap-5 lg:grid-cols-2"></div>
      </section>
    </main>

    <div id="appFooter"></div>

    <script src="../../assets/js/core/config.js"></script>
    <script src="../../assets/js/core/api.js"></script>
    <script src="../../assets/js/core/auth.js"></script>
    <script src="../../assets/js/layouts/user-layout.js"></script>
    <script src="../../assets/js/user/tickets.js"></script>
  </body>
</html>
