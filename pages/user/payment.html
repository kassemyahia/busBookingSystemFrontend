<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>BusBooking | Payment</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="../../assets/css/styles.css" />
  </head>

  <body class="bg-slate-50 text-slate-900">
    <div id="appHeader"></div>

    <main
      class="mx-auto min-h-[calc(100vh-8rem)] max-w-4xl px-5 py-10 sm:px-6 lg:px-8"
    >
      <div class="mb-8">
        <p class="text-sm font-semibold text-teal-700">Step 3 of 3</p>

        <h1 class="mt-2 text-3xl font-bold">Complete payment</h1>

        <p class="mt-3 text-slate-500">
          Choose how you want to complete your booking.
        </p>
      </div>

      <div id="paymentAlert" class="mb-6 hidden"></div>

      <div class="grid gap-6 lg:grid-cols-[1fr_0.8fr]">
        <section
          class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm"
        >
          <h2 class="text-lg font-bold">Payment method</h2>

          <form id="paymentForm" class="mt-6 space-y-4">
            <label
              class="flex cursor-pointer items-start gap-4 rounded-2xl border border-slate-200 p-5 transition has-[:checked]:border-teal-600 has-[:checked]:bg-teal-50"
            >
              <input
                type="radio"
                name="paymentMethod"
                value="1"
                checked
                class="mt-1"
              />

              <div>
                <p class="font-semibold">Card payment</p>

                <p class="mt-1 text-sm leading-6 text-slate-500">
                  Complete your reservation securely using a payment card.
                </p>
              </div>
            </label>

            <label
              class="flex cursor-pointer items-start gap-4 rounded-2xl border border-slate-200 p-5 transition has-[:checked]:border-teal-600 has-[:checked]:bg-teal-50"
            >
              <input type="radio" name="paymentMethod" value="2" class="mt-1" />

              <div>
                <p class="font-semibold">Cash at office</p>

                <p class="mt-1 text-sm leading-6 text-slate-500">
                  Reserve online and complete payment at the booking office.
                </p>
              </div>
            </label>

            <button
              id="payButton"
              type="submit"
              class="mt-4 w-full rounded-xl bg-teal-600 px-5 py-3.5 text-sm font-semibold text-white hover:bg-teal-700 disabled:opacity-50"
            >
              Complete payment
            </button>
          </form>
        </section>

        <aside
          id="paymentSummary"
          class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm"
        >
          <p class="text-sm text-slate-400">Loading booking...</p>
        </aside>
      </div>
    </main>

    <div id="appFooter"></div>

    <script src="../../assets/js/core/config.js"></script>
    <script src="../../assets/js/core/api.js"></script>
    <script src="../../assets/js/core/auth.js"></script>
    <script src="../../assets/js/layouts/user-layout.js"></script>
    <script src="../../assets/js/user/payment.js"></script>
  </body>
</html>
