<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>BusBooking | Driver Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../../assets/css/styles.css" />
  </head>
  <body class="min-h-screen bg-slate-50">
    <main class="grid min-h-screen place-items-center p-5">
      <section
        class="w-full max-w-md rounded-2xl border bg-white p-8 shadow-xl"
      >
        <a href="../../index.html" class="mb-8 block text-xl font-bold"
          >BusBooking <span class="text-teal-700">Driver</span></a
        >
        <h1 class="text-3xl font-bold">Driver sign in</h1>
        <div
          id="alert"
          class="mt-5 hidden rounded-xl border border-red-200 bg-red-50 p-3 text-sm text-red-700"
        ></div>
        <form id="loginForm" class="mt-6 space-y-4">
          <label class="block text-sm font-semibold"
            >Phone<input
              name="phone"
              inputmode="numeric"
              maxlength="10"
              required
              placeholder="09XXXXXXXX"
              class="mt-2 w-full rounded-xl border px-4 py-3" /></label
          ><label class="block text-sm font-semibold"
            >Password<input
              name="password"
              type="password"
              required
              class="mt-2 w-full rounded-xl border px-4 py-3" /></label
          ><label class="flex gap-2 text-sm"
            ><input name="remember" type="checkbox" /> Keep me signed in</label
          ><button
            id="loginButton"
            class="w-full rounded-xl bg-slate-950 px-4 py-3 font-semibold text-white"
          >
            Sign in
          </button>
        </form>
        <p class="mt-6 text-center text-sm">
          <a class="text-teal-700" href="./staff-login.html">Staff login</a> ·
          <a href="./login.html">Passenger login</a>
        </p>
      </section>
    </main>
    <script src="../../assets/js/core/config.js"></script>
    <script src="../../assets/js/core/api.js"></script>
    <script src="../../assets/js/core/auth.js"></script>
    <script src="../../assets/js/auth/driver-login.js"></script>
  </body>
</html>
