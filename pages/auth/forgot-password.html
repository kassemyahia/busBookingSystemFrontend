<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BusBooking | Reset password</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="../../assets/css/styles.css"></head>
<body class="min-h-screen bg-slate-50 text-slate-900">
  <main class="grid min-h-screen lg:grid-cols-[1fr_1.05fr]">
    <section class="travel-hero hidden p-12 text-white lg:flex lg:flex-col lg:justify-between"><a href="../../index.html" class="flex items-center gap-3"><span class="grid h-11 w-11 place-items-center rounded-xl bg-teal-500 text-xl font-extrabold">B</span><strong class="text-xl">BusBooking</strong></a><div><p class="text-sm font-bold uppercase tracking-[.2em] text-teal-300">Account recovery</p><h1 class="mt-4 max-w-lg text-5xl font-extrabold leading-tight">Get back to planning your journey.</h1><p class="mt-5 max-w-lg leading-7 text-slate-300">Verify your registered phone number and choose a new secure password.</p></div><p class="text-sm text-slate-400">Secure passenger access</p></section>
    <section class="flex items-center justify-center px-5 py-12 sm:px-8"><div class="w-full max-w-md"><a href="./login.html" class="mb-10 inline-flex items-center gap-2 text-sm font-semibold text-slate-500 hover:text-teal-700">← Back to sign in</a><div class="mb-8"><p id="stepLabel" class="text-sm font-bold text-teal-700">Step 1 of 3</p><h2 id="stepTitle" class="mt-2 text-4xl font-extrabold tracking-tight">Reset your password</h2><p id="stepDescription" class="mt-3 text-sm leading-6 text-slate-500">Enter the phone number linked to your account.</p></div><div id="recoveryAlert" class="mb-5 hidden"></div>
      <form id="phoneStep" class="space-y-5"><label class="block"><span class="mb-2 block text-sm font-semibold">Phone number</span><input id="recoveryPhone" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel" required placeholder="09XXXXXXXX" class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3.5 outline-none focus:border-teal-600"></label><button class="w-full rounded-xl bg-teal-600 px-5 py-3.5 text-sm font-bold text-white hover:bg-teal-700 disabled:opacity-50">Send verification code</button></form>
      <form id="codeStep" class="hidden space-y-5"><label class="block"><span class="mb-2 block text-sm font-semibold">Four-digit verification code</span><input id="recoveryCode" type="text" inputmode="numeric" maxlength="4" autocomplete="one-time-code" required placeholder="0000" class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3.5 text-center text-2xl font-bold tracking-[.45em] outline-none focus:border-teal-600"></label><button class="w-full rounded-xl bg-teal-600 px-5 py-3.5 text-sm font-bold text-white hover:bg-teal-700 disabled:opacity-50">Verify code</button><button id="restartRecovery" type="button" class="w-full text-sm font-semibold text-slate-500 hover:text-teal-700">Use another phone number</button></form>
      <form id="passwordStep" class="hidden space-y-5"><label class="block"><span class="mb-2 block text-sm font-semibold">New password</span><input id="newRecoveryPassword" type="password" autocomplete="new-password" required minlength="8" maxlength="49" class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3.5 outline-none focus:border-teal-600"><span class="mt-2 block text-xs leading-5 text-slate-400">Use at least 8 characters with an English letter, number and symbol.</span></label><label class="block"><span class="mb-2 block text-sm font-semibold">Confirm password</span><input id="confirmRecoveryPassword" type="password" autocomplete="new-password" required class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3.5 outline-none focus:border-teal-600"></label><button class="w-full rounded-xl bg-teal-600 px-5 py-3.5 text-sm font-bold text-white hover:bg-teal-700 disabled:opacity-50">Save new password</button></form>
    </div></section>
  </main>
  <script src="../../assets/js/core/config.js"></script><script src="../../assets/js/core/api.js"></script><script src="../../assets/js/auth/forgot-password.js"></script>
</body></html>
