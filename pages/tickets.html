<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>BusBooking | My tickets</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="../css/styles.css" />
  </head>

  <body class="bg-slate-50 text-slate-900">
    <div id="appHeader"></div>

    <main
      class="mx-auto min-h-[calc(100vh-8rem)] max-w-7xl px-5 py-10 sm:px-6 lg:px-8"
    >
      <div
        class="mb-8 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between"
      >
        <div>
          <p class="text-sm font-semibold text-cyan-700">Your journeys</p>

          <h1 class="mt-2 text-3xl font-bold">My tickets</h1>

          <p class="mt-3 text-slate-500">
            View pending and confirmed bookings.
          </p>
        </div>

        <a
          href="./trips.html"
          class="rounded-xl bg-slate-950 px-5 py-3 text-center text-sm font-semibold text-white hover:bg-slate-800"
        >
          Book another trip
        </a>
      </div>

      <div id="ticketsAlert" class="mb-6 hidden"></div>

      <div
        class="mb-6 inline-flex rounded-xl border border-slate-200 bg-white p-1"
      >
        <button
          id="normalTicketsTab"
          type="button"
          class="rounded-lg bg-slate-950 px-4 py-2 text-sm font-semibold text-white"
        >
          Travel tickets
        </button>

        <button
          id="discountTicketsTab"
          type="button"
          class="rounded-lg px-4 py-2 text-sm font-semibold text-slate-500"
        >
          Discount tickets
        </button>
      </div>

      <section id="normalTicketsSection">
        <div id="ticketsLoading" class="py-20 text-center text-slate-400">
          Loading tickets...
        </div>

        <div id="ticketsGrid" class="grid gap-5 lg:grid-cols-2"></div>
      </section>

      <section id="discountTicketsSection" class="hidden">
        <div id="discountGrid" class="grid gap-5 lg:grid-cols-2"></div>
      </section>
    </main>

    <div id="appFooter"></div>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/tickets.js"></script>
  </body>
</html>
